[project]
name = "nfse-yolov8"
version = "2.0.0"
description = "A small, local NFS-e extraction API using YOLO and Portuguese OCR"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn>=0.54.0,<1",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.32,<1",
    "ultralytics>=8.4.172,<9",
    "pytesseract>=0.3.13,<0.4",
    "pypdfium2>=5.13.0,<6",
    "pillow>=12.3.0,<13",
    "numpy>=2.5.3,<3",
    "opencv-python>=5.0.0.93,<6",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1,<1",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "httpx2>=2.13.1,<3", "ruff>=0.16.10,<1"]

[tool.uv]
package = false

# CPU wheels keep the default install usable without a GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: runs the bundled model and local Tesseract"]
